<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="mascot-title">
  <title id="mascot-title">The Thunderdome mascot: an orange cloud with a glass dome, a lightning bolt and a crown</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd55"/>
      <stop offset="1" stop-color="#f0a21c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#f7a400"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f0fc" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#9fd0ee" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="175" cy="290" r="210">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#f28a4a"/>
    </radialGradient>
    <!-- The cloud's bumps; drawn twice: outlined underneath, then filled on top, so only the outer edge shows a line. -->
    <g id="cloud">
      <circle cx="92" cy="335" r="44"/>
      <circle cx="128" cy="292" r="46"/>
      <circle cx="308" cy="335" r="44"/>
      <circle cx="272" cy="292" r="46"/>
      <circle cx="122" cy="368" r="46"/>
      <circle cx="278" cy="368" r="46"/>
      <circle cx="165" cy="378" r="42"/>
      <circle cx="235" cy="378" r="42"/>
      <circle cx="200" cy="335" r="80"/>
    </g>
  </defs>

  <!-- Shadow: semi-transparent, so it works on any background. -->
  <ellipse cx="200" cy="458" rx="125" ry="9" fill="#000" fill-opacity="0.14"/>

  <!-- Legs -->
  <g fill="url(#body)" stroke="#b8571f" stroke-width="5">
    <rect x="146" y="388" width="40" height="66" rx="20"/>
    <rect x="214" y="388" width="40" height="66" rx="20"/>
  </g>

  <!-- Body -->
  <use href="#cloud" fill="#b8571f" stroke="#b8571f" stroke-width="10"/>
  <use href="#cloud" fill="url(#body)"/>

  <!-- Glass dome -->
  <path d="M106 300 A94 94 0 0 1 294 300 Z" fill="url(#glass)" stroke="#5e9cc6" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="300" rx="92" ry="13" fill="#8cc5e8" fill-opacity="0.7" stroke="#5e9cc6" stroke-width="3"/>
  <path d="M138 252 A70 70 0 0 1 176 222" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round"/>
  <circle cx="132" cy="270" r="5" fill="#fff" fill-opacity="0.85"/>

  <!-- Lightning bolt -->
  <path d="M213 226 L178 268 L199 268 L188 300 L229 252 L207 252 L223 226 Z" fill="url(#bolt)" stroke="#c27a06" stroke-width="4" stroke-linejoin="round"/>

  <!-- Crown -->
  <g stroke="#a86a06" stroke-width="4" stroke-linejoin="round">
    <path d="M150 210 L144 156 L165 178 L178 144 L190 170 L200 128 L210 170 L222 144 L235 178 L256 156 L250 210 Z" fill="url(#gold)"/>
    <rect x="147" y="194" width="106" height="18" rx="4" fill="#e9a21e"/>
    <circle cx="144" cy="156" r="6" fill="url(#gold)"/>
    <circle cx="178" cy="144" r="6" fill="url(#gold)"/>
    <circle cx="222" cy="144" r="6" fill="url(#gold)"/>
    <circle cx="256" cy="156" r="6" fill="url(#gold)"/>
    <path d="M200 106 V128 M191 114 H209" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 106 V128 M191 114 H209" fill="none" stroke="#ffd34d" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M170 196 L176 203 L170 210 L164 203 Z" fill="#e0344a" stroke="#8c1a2a" stroke-width="2"/>
  <path d="M230 196 L236 203 L230 210 L224 203 Z" fill="#3d5bd9" stroke="#1f2f7a" stroke-width="2"/>
  <circle cx="200" cy="203" r="5" fill="#e0344a" stroke="#8c1a2a" stroke-width="2"/>

  <!-- Face -->
  <g fill="#1f1d2b">
    <circle cx="164" cy="345" r="15"/>
    <circle cx="236" cy="345" r="15"/>
  </g>
  <g fill="#fff">
    <circle cx="159" cy="339" r="5.5"/>
    <circle cx="231" cy="339" r="5.5"/>
    <circle cx="169" cy="351" r="2.2"/>
    <circle cx="241" cy="351" r="2.2"/>
  </g>
  <path d="M187 366 Q200 380 213 366" fill="none" stroke="#1f1d2b" stroke-width="4.5" stroke-linecap="round"/>
  <g fill="#ff6b6b" fill-opacity="0.45">
    <ellipse cx="133" cy="368" rx="13" ry="7.5"/>
    <ellipse cx="267" cy="368" rx="13" ry="7.5"/>
  </g>
</svg>
